name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  quality:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files '*.dart' | grep -v '^lib/l10n/app_localizations')

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import os
          hit = found = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('LH:'): hit += int(line[3:])
              if line.startswith('LF:'): found += int(line[3:])
          pct = 100 * hit / found
          print(f'Line coverage: {pct:.1f}% ({hit}/{found})')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'### Couverture de code : {pct:.1f}% ({hit}/{found} lignes)\n')
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info

  integration:
    name: Integration tests (Linux desktop)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - run: flutter pub get

      # Un fichier à la fois : l'app Linux est mono-instance (GApplication).
      - name: Run integration tests
        run: |
          for test in integration_test/*_test.dart; do
            [ "$test" = integration_test/screenshots_test.dart ] && continue
            echo "::group::$test"
            xvfb-run -a flutter test "$test" -d linux
            echo "::endgroup::"
          done

  android:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # La clé de signature vient des secrets du dépôt. Sans elle, les builds
      # de branche restent signés en debug, mais un tag de version échoue :
      # on ne publie jamais une release signée avec la clé de debug.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Secrets de signature absents : release refusée."
              exit 1
            fi
            echo "::warning::Pas de clé de signature : APK signé en debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # Code Dart obfusqué ; les symboles de débogage sont conservés à part
      # pour pouvoir lire les traces de crash.
      - name: Build release APK and App Bundle
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Rename artifacts
        run: |
          name="riverstore-${GITHUB_REF_NAME//\//-}"
          mv build/app/outputs/flutter-apk/app-release.apk "$name.apk"
          mv build/app/outputs/bundle/release/app-release.aab "$name.aab"

      - uses: actions/upload-artifact@v6
        with:
          name: riverstore-android
          path: |
            riverstore-*.apk
            riverstore-*.aab

      - uses: actions/upload-artifact@v6
        with:
          name: debug-symbols
          path: build/symbols

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            riverstore-*.apk
            riverstore-*.aab
          generate_release_notes: true

name: riverstore
description: "RiverStore — application e-commerce Flutter production-ready (Riverpod, hooks, go_router, i18n FR/EN)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.3+1
  go_router: ^18.0.2
  hooks_riverpod: ^3.4.3
  intl: ^0.20.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/products.json
